schema_version = "1.4"
artifacts = [{source = "/workspace/answer.json"}]

[task]
name = "blueprint-takeoff/bp-12-scan"
version = "1.0.0"
description = "Suction header diameter"

[metadata]
family = "piping"
condition = "scan"
difficulty = "hard"
scenario_id = "bp-12"
split = "train"

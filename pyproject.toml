[project]
name = "blueprint-takeoff-gym"
version = "0.1.0"
description = "A verifiable construction-drawing environment and interactive evaluation workbench"
requires-python = ">=3.12"
dependencies = [
  "harbor[modal]==0.26.0",
  "modal==1.6.4",
  "fastapi==0.163.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
  "PyMuPDF==2.1",
  "Pillow==13.0.0",
  "numpy==2.5.4",
]

[dependency-groups]
dev = ["pytest==9.2.0", "playwright==1.65.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
